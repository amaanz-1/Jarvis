<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #050a10;
    --panel: #0a1620;
    --arc: #5ecbff;
    --arc-dim: #2c7fa3;
    --arc-hot: #baf1ff;
    --amber: #ffb454;
    --ink: #d6ecf7;
    --ink-dim: #6f93a3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background: radial-gradient(ellipse at 50% 30%, #0c1d2a 0%, #050a10 60%, #020407 100%);
    color:var(--ink);
    font-family:'Rajdhani', sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body{
    display:flex;
    flex-direction:column;
    height:100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .grid-overlay{
    position:fixed; inset:0; pointer-events:none; z-index:1;
    background-image:
      linear-gradient(rgba(94,203,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(94,203,255,0.035) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse at 50% 40%, black 0%, transparent 75%);
  }
  header{
    position:relative; z-index:2;
    display:flex; justify-content:space-between; align-items:center;
    padding: 18px 22px 8px;
    font-family:'Orbitron', sans-serif;
  }
  .brand{
    font-size:13px; letter-spacing:4px; font-weight:700; color:var(--arc);
    text-shadow: 0 0 12px rgba(94,203,255,0.6);
  }
  .brand span{color:var(--ink-dim); font-weight:400;}
  .clock{font-size:11px; letter-spacing:2px; color:var(--ink-dim);}
  main{
    position:relative; z-index:2;
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px;
    padding: 0 20px;
  }
  .orb-wrap{
    position:relative;
    width: min(64vw, 280px); height: min(64vw, 280px);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    user-select:none;
    touch-action: manipulation;
  }
  .orb-wrap svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
  .ring{ transform-origin:50% 50%; }
  .ring.r1{animation: spin 18s linear infinite;}
  .ring.r2{animation: spin 26s linear infinite reverse;}
  .ring.r3{animation: spin 40s linear infinite;}
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .core{
    position:relative;
    width:38%; height:38%;
    border-radius:50%;
    background: radial-gradient(circle at 40% 35%, var(--arc-hot), var(--arc) 45%, #0b3a4d 100%);
    box-shadow:
      0 0 30px 6px rgba(94,203,255,0.55),
      0 0 80px 20px rgba(94,203,255,0.18),
      inset 0 0 20px rgba(255,255,255,0.35);
    transition: box-shadow .4s ease, background .4s ease, transform .3s ease;
  }
  .orb-wrap.listening .core{
    animation: pulse 1.4s ease-in-out infinite;
    box-shadow: 0 0 45px 10px rgba(94,203,255,0.8), 0 0 110px 30px rgba(94,203,255,0.3), inset 0 0 24px rgba(255,255,255,0.5);
  }
  .orb-wrap.thinking .core{
    background: radial-gradient(circle at 40% 35%, #ffe6bf, var(--amber) 45%, #6b3d0b 100%);
    box-shadow: 0 0 40px 8px rgba(255,180,84,0.65), 0 0 90px 24px rgba(255,180,84,0.22), inset 0 0 20px rgba(255,255,255,0.4);
  }
  .orb-wrap.thinking .ring{ animation-duration: 3s !important; }
  .orb-wrap.speaking .core{
    animation: speak 0.5s ease-in-out infinite alternate;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.09); }
  }
  @keyframes speak{
    from{ transform:scale(1); }
    to{ transform:scale(1.05); }
  }
  .status{
    font-family:'Orbitron', sans-serif;
    font-size: 12px;
    letter-spacing: 5px;
    font-weight:600;
    color: var(--arc);
    text-shadow: 0 0 10px rgba(94,203,255,0.5);
    text-align:center;
    min-height: 16px;
  }
  .hint{
    font-size:13px; color:var(--ink-dim); letter-spacing:1px; text-align:center;
  }
  .telemetry{
    display:flex; gap:18px; font-size:10px; letter-spacing:1.5px; color:var(--ink-dim);
    font-family:'Orbitron', sans-serif;
  }
  .telemetry b{ color: var(--arc-dim); }
  .log{
    position:relative; z-index:2;
    width:100%;
    max-height: 30vh;
    overflow-y:auto;
    padding: 10px 18px 4px;
    display:flex; flex-direction:column; gap:10px;
    -webkit-overflow-scrolling:touch;
    mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 100%);
  }
  .line{ font-size:15px; line-height:1.4; max-width: 92%; }
  .line.user{ align-self:flex-end; text-align:right; color:var(--ink); }
  .line.user .who{ color:var(--amber); }
  .line.jarvis{ align-self:flex-start; color:var(--ink); }
  .line.jarvis .who{ color:var(--arc); }
  .who{ font-family:'Orbitron', sans-serif; font-size:10px; letter-spacing:2px; display:block; margin-bottom:2px; opacity:0.8;}
  footer{
    position:relative; z-index:2;
    padding: 10px 20px calc(16px + env(safe-area-inset-bottom));
    text-align:center;
  }
  .err{ color:var(--amber); font-size:12px; letter-spacing:1px; }
</style>
</head>
<body>
  <div class="grid-overlay"></div>

  <header>
    <div class="brand">J.A.R.V.I.S. <span>// v0.2</span></div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <main>
    <div class="orb-wrap" id="orbWrap">
      <svg viewBox="0 0 200 200">
        <circle class="ring r3" cx="100" cy="100" r="94" fill="none" stroke="rgba(94,203,255,0.15)" stroke-width="1"/>
        <circle class="ring r2" cx="100" cy="100" r="80" fill="none" stroke="rgba(94,203,255,0.35)" stroke-width="1" stroke-dasharray="4 10"/>
        <circle class="ring r1" cx="100" cy="100" r="66" fill="none" stroke="rgba(94,203,255,0.55)" stroke-width="1.5" stroke-dasharray="1 8"/>
      </svg>
      <div class="core" id="core"></div>
    </div>

    <div class="status" id="status">STANDBY</div>
    <div class="hint" id="hint">Tap the core to speak</div>

    <div class="telemetry">
      <span><b>LAT</b> <span id="lat">--</span>ms</span>
      <span><b>SYS</b> NOMINAL</span>
      <span><b>MIC</b> <span id="micState">READY</span></span>
    </div>
  </main>

  <div class="log" id="log"></div>

  <footer>
    <div class="err" id="err"></div>
  </footer>

<script>
(function(){
  const orbWrap = document.getElementById('orbWrap');
  const statusEl = document.getElementById('status');
  const hintEl = document.getElementById('hint');
  const logEl = document.getElementById('log');
  const errEl = document.getElementById('err');
  const clockEl = document.getElementById('clock');
  const latEl = document.getElementById('lat');
  const micStateEl = document.getElementById('micState');

  function tickClock(){
    const d = new Date();
    clockEl.textContent = d.toTimeString().slice(0,8);
  }
  tickClock(); setInterval(tickClock, 1000);

  let conversation = [];
  let voices = [];
  let chosenVoice = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;
  let currentAudio = null;

  function setState(state){
    orbWrap.classList.remove('listening','thinking','speaking');
    if(state) orbWrap.classList.add(state);
    const labels = {
      listening: 'LISTENING',
      thinking: 'PROCESSING',
      speaking: 'RESPONDING',
      '': 'STANDBY'
    };
    statusEl.textContent = labels[state] || 'STANDBY';
  }

  function addLine(who, text){
    const div = document.createElement('div');
    div.className = 'line ' + (who === 'You' ? 'user' : 'jarvis');
    div.innerHTML = '<span class="who">' + who + '</span>' + text;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function pickVoice(){
    voices = speechSynthesis.getVoices();
    chosenVoice =
      voices.find(v => /en-GB/i.test(v.lang) && /male|daniel|arthur|oliver|ryan/i.test(v.name)) ||
      voices.find(v => /en-GB/i.test(v.lang)) ||
      voices.find(v => /en-/i.test(v.lang)) ||
      voices[0];
  }
  if('speechSynthesis' in window){
    speechSynthesis.onvoiceschanged = pickVoice;
    pickVoice();
  }

  function speakBrowserFallback(text){
    return new Promise((resolve) => {
      if(!('speechSynthesis' in window)){ resolve(); return; }
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      if(chosenVoice) utter.voice = chosenVoice;
      utter.rate = 1.0;
      utter.pitch = 0.85;
      utter.onend = resolve;
      utter.onerror = resolve;
      speechSynthesis.speak(utter);
    });
  }

  function speak(text){
    return new Promise(async (resolve) => {
      setState('speaking');
      try{
        const res = await fetch('/.netlify/functions/speak', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ text })
        });
        if(!res.ok){
          const errBody = await res.text();
          errEl.textContent = 'Voice error (' + res.status + '): ' + errBody.slice(0,200);
          throw new Error('tts failed');
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        if(currentAudio){ currentAudio.pause(); }
        currentAudio = new Audio(url);
        currentAudio.onended = () => { URL.revokeObjectURL(url); resolve(); };
        currentAudio.onerror = () => { URL.revokeObjectURL(url); resolve(); };
        await currentAudio.play();
      }catch(e){
        await speakBrowserFallback(text);
        resolve();
      }
    });
  }

  function blobToBase64(blob){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function askJarvis(userText){
    conversation.push({ role:'user', content: userText });
    setState('thinking');
    const t0 = performance.now();
    try{
      const res = await fetch('/.netlify/functions/chat', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ messages: conversation })
      });
      const data = await res.json();
      const latency = Math.round(performance.now() - t0);
      latEl.textContent = latency;

      const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
      const reply = textBlocks.join(' ').trim() || "I'm afraid I didn't catch a usable response, sir.";
      conversation.push({ role:'assistant', content: reply });
      addLine('JARVIS', reply);
      await speak(reply);
    }catch(e){
      errEl.textContent = 'Connection issue — check your network settings.';
      addLine('JARVIS', "I'm having trouble reaching my systems right now.");
    }
    setState('');
    hintEl.textContent = 'Tap the core to speak';
  }

  async function transcribeAndAsk(blob){
    setState('thinking');
    hintEl.textContent = 'Transcribing…';
    try{
      const base64 = await blobToBase64(blob);
      const res = await fetch('/.netlify/functions/transcribe', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ audioBase64: base64, mimeType: blob.type })
      });
      if(!res.ok){
        const errBody = await res.text();
        errEl.textContent = 'Transcribe error (' + res.status + '): ' + errBody.slice(0,200);
        setState('');
        hintEl.textContent = 'Tap the core to speak';
        return;
      }
      const data = await res.json();
      const transcript = (data.text || '').trim();
      if(!transcript){
        errEl.textContent = 'No speech detected — tap and try again.';
        setState('');
        hintEl.textContent = 'Tap the core to speak';
        return;
      }
      errEl.textContent = '';
      addLine('You', transcript);
      await askJarvis(transcript);
    }catch(e){
      errEl.textContent = 'Transcription failed: ' + e.message;
      setState('');
      hintEl.textContent = 'Tap the core to speak';
    }
  }

  async function startRecording(){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      const options = MediaRecorder.isTypeSupported('audio/webm') ? { mimeType: 'audio/webm' } : {};
      mediaRecorder = new MediaRecorder(stream, options);
      mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        micStateEl.textContent = 'READY';
        const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        await transcribeAndAsk(blob);
      };
      mediaRecorder.start();
      isRecording = true;
      micStateEl.textContent = 'LIVE';
      setState('listening');
      hintEl.textContent = 'Listening… tap to stop';
      errEl.textContent = '';
    }catch(e){
      errEl.textContent = 'Microphone access denied — check Safari settings for this site.';
      setState('');
    }
  }

  function stopRecording(){
    if(mediaRecorder && isRecording){
      mediaRecorder.stop();
      isRecording = false;
    }
  }

  let greeted = false;
  function timeGreeting(){
    const h = new Date().getHours();
    if(h < 12) return 'Good morning, sir. Systems are online and ready.';
    if(h < 18) return 'Good afternoon, sir. All systems nominal.';
    return 'Good evening, sir. Standing by whenever you need me.';
  }

  orbWrap.addEventListener('click', async () => {
    if(!greeted){
      greeted = true;
      const greeting = timeGreeting();
      addLine('JARVIS', greeting);
      await speak(greeting);
      setState('');
      hintEl.textContent = 'Tap the core to speak';
      return;
    }

    if(currentAudio && !currentAudio.paused){ currentAudio.pause(); }
    if(speechSynthesis.speaking){ speechSynthesis.cancel(); }

    if(isRecording){
      stopRecording();
    } else {
      await startRecording();
    }
  });

})();
</script>
</body>
</html>
